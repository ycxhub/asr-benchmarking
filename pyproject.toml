[project]
name = "asrbench"
version = "1.0.0"
description = "Streaming speech-to-text benchmark (WER + voice-agent latency) for Murf STT vs competitors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3.7",
    "onnxruntime>=1.17",
    "jiwer>=4.0",
    "whisper-normalizer>=0.1.12",
    "indic-nlp-library>=0.92",
    "websockets>=14.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "huggingface_hub>=0.25",
    "pyarrow>=16.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
asrbench = "asrbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asrbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
