{% extends "base.html" %}
{% block title %}{{ run_id }}{% endblock %}
{% block body %}
<h2>{{ run_id }}</h2>
<p class="muted">{{ meta.dataset }} · {{ meta.mode }} · {{ meta.condition }} · {{ meta.lang }}</p>
<div id="live"
     hx-get="/runs/{{ run_id }}/progress"
     hx-trigger="load, every 2s"
     hx-swap="innerHTML">
  <p>Status: {{ status }}</p>
</div>
{% endblock %}
